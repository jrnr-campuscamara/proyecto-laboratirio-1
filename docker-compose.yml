version: '3.8'

networks:
    bigdata-net:
        driver: bridge
        name: bigdata-net

volumes:
    hadoop_namenode:
    hadoop_datanode:
    spark_master_data:
    kafka_data:
    mongo_data:
    postgres_data:
    jupyter_workspace:
    mysql_data:

services:
    # 1. ENTORNO DE TRABAJO (JUPYTERLAB + ANACONDA + LIBRERÍAS DE IA Y BIG DATA)
    jupyter-anaconda:
        image: continuumio/anaconda3:latest
        container_name: jupyter-anaconda
        hostname: jupyter-anaconda
        restart: always
        ports:
            - "8888:8888"
        environment:
            - JUPYTER_ENABLE_LAB=yes
        volumes:
            - jupyter_workspace:/opt/notebooks
            - ./workspace:/opt/notebooks/workspace
        networks:
            - bigdata-net
        command: >
            bash -c " mkdir -p /opt/notebooks/workspace/{5073_Modelos_IA,5074_Aprendizaje_Automático,5075_Programacion_IA,5076_Sistemas_BigData,5077_BigData_Aplicado} && pip install --no-cache-dir \
              tensorflow torch scikit-learn pandas numpy matplotlib seaborn \
              pyspark==3.5.0 findspark pymongo psycopg2-binary kafka-python-ng delta-spark &&
            jupyter lab --notebook-dir=/opt/notebooks --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password='' "

    # 2. HADOOP 3.4.0 (NAMENODE Y DATANODE HDFS)
    namenode:
        image: apache/hadoop:3.4.0
        container_name: namenode
        hostname: namenode
        user: root
        environment:
            - ENSURE_NAMENODE_DIR=/tmp/hadoop-root/dfs/name
            - CORE-SITE.XML_fs.defaultFS=hdfs://namenode:9000
            - HDFS-SITE.XML_dfs.namenode.rpc-address=namenode:9000
            - HDFS-SITE.XML_dfs.replication=1
            - HDFS-SITE.XML_dfs.permissions.enabled=false
        ports:
            - "9870:9870"
            - "9000:9000"
        volumes:
            - hadoop_namenode:/tmp/hadoop-root/dfs/name
        networks:
            - bigdata-net
        command: [ "hdfs", "namenode" ]

    datanode:
        image: apache/hadoop:3.4.0
        container_name: datanode
        hostname: datanode
        user: root
        ports:
            - "9864:9864"
        environment:
            - CORE-SITE.XML_fs.defaultFS=hdfs://namenode:9000
            - HDFS-SITE.XML_dfs.replication=1
            - HDFS-SITE.XML_dfs.permissions.enabled=false
        volumes:
            - hadoop_datanode:/tmp/hadoop-root/dfs/data
        networks:
            - bigdata-net
        depends_on:
            - namenode
        command: [ "hdfs", "datanode" ]

    # 3. APACHE SPARK 3.5.0 (MASTER Y WORKER)
    spark-master:
        image: bitnami/spark:3.5.0
        container_name: spark-master
        hostname: spark-master
        environment:
            - SPARK_MODE=master
            - SPARK_RPC_AUTHENTICATION_ENABLED=no
            - SPARK_RPC_ENCRYPTION_ENABLED=no
            - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
            - SPARK_SSL_ENABLED=no
        ports:
            - "8080:8080"
            - "7077:7077"
        volumes:
            - spark_master_data:/opt/bitnami/spark
        networks:
            - bigdata-net

    spark-worker:
        image: bitnami/spark:3.5.0
        container_name: spark-worker
        hostname: spark-worker
        environment:
            - SPARK_MODE=worker
            - SPARK_MASTER_URL=spark://spark-master:7077
            - SPARK_WORKER_MEMORY=2G
            - SPARK_WORKER_CORES=2
            - SPARK_RPC_AUTHENTICATION_ENABLED=no
            - SPARK_RPC_ENCRYPTION_ENABLED=no
            - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
            - SPARK_SSL_ENABLED=no
        ports:
            - "8081:8081"
        networks:
            - bigdata-net
        depends_on:
            - spark-master

    # 4. APACHE KAFKA 3.8.0 (MODO KRAFT)
    kafka:
        image: apache/kafka:3.8.0
        container_name: kafka
        hostname: kafka
        ports:
            - "9092:9092"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        volumes:
            - kafka_data:/var/lib/kafka/data
        networks:
            - bigdata-net

    # 5. BASES DE DATOS (MONGODB 7.0 Y POSTGRESQL 16)
    mongodb:
        image: mongo:7.0
        container_name: mongodb
        hostname: mongodb
        ports:
            - "27017:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: root
            MONGO_INITDB_ROOT_PASSWORD: rootpassword
        volumes:
            - mongo_data:/data/db
        networks:
            - bigdata-net

    postgres:
        image: postgres:16-alpine
        container_name: postgres
        hostname: postgres
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: adminpassword
            POSTGRES_DB: master_db
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - bigdata-net

    mysql:
        image: mysql:8.0
        container_name: mysql
        hostname: mysql
        restart: always
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
        volumes:
            - mysql_data:/var/lib/mysql
            - ./mysql-init:/docker-entrypoint-initdb.d
        networks:
            - bigdata-net

    ingesta:
        build: ./ingesta
        container_name: ingesta
        hostname: ingesta
        networks:
            - bigdata-net
        depends_on:
            - namenode
            - mysql